name: Event Notifier

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Restore the seen-events state from the previous run. The key is unique
      # per run so the cache is always (re)written at job end with the latest
      # state.json, while restore-keys picks up the most recent prior cache.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            notifier-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m notifier
